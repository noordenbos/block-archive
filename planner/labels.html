<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"><title>Spatial Prep | Local labels</title><link rel="stylesheet" href="style.css"><style>body{padding:28px}.sheet{display:grid;grid-template-columns:repeat(2,1fr);max-width:1000px}.label{background:white;border:1px dashed #91a59a;min-height:160px;padding:16px;display:flex;align-items:center;gap:20px}.label img{width:120px;height:120px;image-rendering:pixelated}.code{font-size:18px;overflow-wrap:anywhere}@media print{.controls{display:none}.label{break-inside:avoid}}</style></head><body><div class="controls"><a href="/">← Spatial Prep</a><h1>Print ID + QR labels</h1><p>Load one ID per CSV row, or paste your list. Processing runs in memory on this PC through the loopback server. No external QR service, telemetry or cloud upload.</p><div class="toolbar"><label class="button">Load human-readable IDs<input id="csv" type="file" accept=".csv,text/csv" hidden></label><button id="generate" class="primary">Generate labels</button><button id="pdf" disabled>Download printable PDF</button><button id="clear">Clear list</button></div><textarea id="ids" placeholder="DUMMY-001&#10;DUMMY-002" aria-label="One human-readable ID per line"></textarea><p id="status" role="status">The list is not saved by this tool. Downloaded PDFs remain wherever you save them.</p></div><main class="sheet" id="sheet"></main><script src="labels.js"></script></body></html>
