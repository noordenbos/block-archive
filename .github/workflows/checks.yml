name: Release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: node tests/geometry.test.js && node tests/ingest.test.js && node tests/scoring-edit.test.js
      - run: python tests/test_pipeline.py && python tests/test_registration.py && python tests/test_server.py
      - run: python -m playwright install --with-deps chromium
      - run: python tests/test_browser.py
      - run: python tools/audit_release.py
